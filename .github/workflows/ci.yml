name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q hvac_scanner

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

      - name: Import smoke test
        shell: python
        run: |
          import hvac_scanner
          from hvac_scanner import ScanEngine, ScanOptions, BACnetClient
          print(f'v{hvac_scanner.__version__}')

      - name: CLI help smoke test
        run: python -m hvac_scanner.cli --help

  build:
    name: Build distributable
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  windows-exe:
    name: Build Windows GUI executable
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build
        run: python -m PyInstaller packaging/hvac_scanner.spec --noconfirm

      - name: Smoke test the executable
        shell: pwsh
        run: |
          # No display on a runner, so the GUI cannot be driven. Starting it
          # and confirming it stays up proves the bundle resolves its imports,
          # which is the failure mode a spec file actually has.
          $p = Start-Process -FilePath dist\HVACNetworkScanner.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "executable exited immediately (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "executable started and stayed running"

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item dist\HVACNetworkScanner.exe
          Write-Host ("HVACNetworkScanner.exe: {0:N1} MB" -f ($f.Length / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: HVACNetworkScanner-windows-exe
          path: dist/HVACNetworkScanner.exe
          retention-days: 30

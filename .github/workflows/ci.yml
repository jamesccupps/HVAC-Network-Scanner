name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job reads the repository and nothing else, except
# where a job below asks for more (the executable's build attestation).
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pinned by commit SHA, not tag: tags can be moved. Dependabot updates
      # these, and the trailing comment says which version each SHA is.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the executable's build lock still resolves (Windows, py3.12)
        # The windows-exe job installs packaging/requirements-build.txt with
        # --require-hashes. Resolving it here means a bad bump or a missing
        # transitive pin turns a push red, not the next tagged release.
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        # A block: in a plain value ":all: -r" would read as a YAML key.
        run: |
          python -m pip install --dry-run --require-hashes --only-binary=:all: -r packaging/requirements-build.txt

      - name: Syntax check
        run: python -m compileall -q hvac_scanner tools packaging

      - name: Install a display and Tk (Linux)
        # The GUI tests build the real window. Without a display they skipped
        # on every Linux leg; Tk plus a virtual framebuffer is all they need.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk xvfb

      - name: Run pytest (Linux, under a virtual framebuffer)
        # -rs lists every skipped test with its reason, so a leg that quietly
        # covers less than it looks like is visible in the log.
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/ -q -rs --tb=short

      - name: Run pytest
        if: runner.os != 'Linux'
        run: python -m pytest tests/ -q -rs --tb=short

      - name: Import smoke test
        shell: python
        run: |
          import hvac_scanner
          from hvac_scanner import ScanEngine, ScanOptions, BACnetClient
          print(f'v{hvac_scanner.__version__}')

      - name: CLI help smoke test
        run: python -m hvac_scanner.cli --help

  build:
    name: Build distributable
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  windows-exe:
    name: Build Windows GUI executable
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write       # signing the build attestation (Sigstore)
      attestations: write   # storing it with the repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No pip cache: this job builds the file people download, and a cache
      # is shared state another workflow run could have written.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling (pinned by hash)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-build.txt

      - name: Build
        # The spec adds the checkout to PyInstaller's search path, so the
        # package is bundled from source without being pip-installed.
        run: python -m PyInstaller packaging/hvac_scanner.spec --noconfirm

      - name: Smoke test the executable
        shell: pwsh
        run: |
          # No display on a runner, so the GUI cannot be driven. Starting it
          # and confirming it stays up proves the bundle resolves its imports,
          # which is the failure mode a spec file actually has.
          $p = Start-Process -FilePath dist\HVACNetworkScanner.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "executable exited immediately (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "executable started and stayed running"

      - name: Update test
        # The previous release with an updater (until there is one, this
        # build) updates itself to this build for real: check, signed
        # manifest, download, swap, restart. Works on copies; dist is untouched.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # only to ask which release came before
        run: ./packaging/test_update.ps1

      - name: Size and SHA-256
        # The hash in the build log, and as a file beside the executable, is
        # what the release notes publish: anyone can check the downloaded
        # file against the build that made it.
        shell: pwsh
        run: |
          $f = Get-Item dist\HVACNetworkScanner.exe
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host ("HVACNetworkScanner.exe: {0:N1} MB" -f ($f.Length / 1MB))
          Write-Host "SHA-256: $h"
          "$h  HVACNetworkScanner.exe" | Out-File -Encoding ascii -NoNewline dist\HVACNetworkScanner.exe.sha256

      - name: Attest where the executable came from
        # A signed statement, kept with the repository, that this exact file
        # was built by this workflow from this commit. Check a download with:
        #   gh attestation verify HVACNetworkScanner.exe --repo jamesccupps/HVAC-Network-Scanner
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/HVACNetworkScanner.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: HVACNetworkScanner-windows-exe
          path: |
            dist/HVACNetworkScanner.exe
            dist/HVACNetworkScanner.exe.sha256
          retention-days: 30

# Actions are pinned by commit SHA (tags can be moved, and the executable's
# build job can sign an attestation). A pinned SHA goes stale silently, so
# Dependabot keeps them current: it understands the `# v7.0.1` comment
# convention and updates the SHA and the comment together.
#
# The scanner itself has no dependencies. The pip entry covers only build
# tooling, pinned by version and hash, which would otherwise go stale too: the
# executable's (packaging/requirements-build.txt) and the PyPI package's
# (packaging/requirements-pypi.txt, from requirements-pypi.in).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "CI"
  - package-ecosystem: "pip"
    directory: "/packaging"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Build"
